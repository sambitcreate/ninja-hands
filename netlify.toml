[build]
  command = "npm run build"
  publish = "dist"
  # Skip deploys when commits only change Markdown files
  ignore = """
    if [ -z \"$CACHED_COMMIT_REF\" ]; then
      # Build when Netlify lacks a cached commit to compare against
      exit 1
    fi

    if git diff --name-only \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" \
       | grep -vEi '\\.(md)$' \
       | grep -q .; then
      # Non-Markdown changes detected; proceed with build
      exit 1
    else
      # Only Markdown changes detected; skip build
      exit 0
    fi
  """
